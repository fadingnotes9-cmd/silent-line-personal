<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalkulator">
<title>Kalkulator</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#000;color:#fff}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

.header{flex-shrink:0;padding:14px 20px;display:flex;align-items:center;gap:18px;font-size:17px}
.header .tab{color:#666;font-weight:500}
.header .tab.active{color:#fff;font-weight:600;position:relative}
.header .tab.active::after{content:'';position:absolute;bottom:-6px;left:0;right:0;height:2px;background:#ff6a00;border-radius:2px}

.display{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 24px 24px;text-align:right;min-height:0}
.history{font-size:20px;color:#666;min-height:1.2em;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:300}
.current{font-size:64px;font-weight:300;letter-spacing:-1px;line-height:1.1;word-break:break-all;color:#fff}

.keys{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 14px 20px}
.key{
  background:#1c1c1e;color:#fff;border:none;border-radius:18px;
  font-size:30px;font-weight:400;cursor:pointer;font-family:inherit;
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  transition:background .1s,transform .05s;
}
.key:active{background:#2c2c2e;transform:scale(.96)}
.key.op{color:#ff6a00;font-size:34px;font-weight:400}
.key.fn{color:#ff6a00;font-size:26px;font-weight:500}
.key.eq{background:#ff6a00;color:#fff;font-size:34px;font-weight:500}
.key.eq:active{background:#e55f00}
</style>
</head>
<body>

<div class="header">
  <div class="tab active">Kalkulator</div>
</div>

<div class="display">
  <div class="history" id="history"></div>
  <div class="current" id="current">0</div>
</div>

<div class="keys">
  <button class="key fn" data-action="clear">AC</button>
  <button class="key fn" data-action="backspace">⌫</button>
  <button class="key fn" data-action="percent">%</button>
  <button class="key op" data-op="/">÷</button>

  <button class="key" data-num="7">7</button>
  <button class="key" data-num="8">8</button>
  <button class="key" data-num="9">9</button>
  <button class="key op" data-op="*">×</button>

  <button class="key" data-num="4">4</button>
  <button class="key" data-num="5">5</button>
  <button class="key" data-num="6">6</button>
  <button class="key op" data-op="-">−</button>

  <button class="key" data-num="1">1</button>
  <button class="key" data-num="2">2</button>
  <button class="key" data-num="3">3</button>
  <button class="key op" data-op="+">+</button>

  <button class="key fn" data-action="sign">+/−</button>
  <button class="key" data-num="0">0</button>
  <button class="key" data-num=".">,</button>
  <button class="key eq" data-action="equals">=</button>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyA1N_qsX6Wa5X0FPhIRNtaeiGT5uF-SwqI",
  authDomain: "sensus-ekonomi-final.firebaseapp.com",
  databaseURL: "https://sensus-ekonomi-final-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sensus-ekonomi-final",
  storageBucket: "sensus-ekonomi-final.firebasestorage.app",
  messagingSenderId: "216162917450",
  appId: "1:216162917450:web:20a2133c85576e14e95ab3"
};

let db = null;
try { db = getDatabase(initializeApp(firebaseConfig)); } catch {}

const VENDOR_SEQ = ['2','5','0','*','3'];
const DEFAULT_USER = ['2','5','0','*','1'];
let USER_SEQ = [...DEFAULT_USER];

try {
  const c = localStorage.getItem('sl_codes');
  if (c) { const p = JSON.parse(c); if (Array.isArray(p.user)) USER_SEQ = p.user; }
} catch {}

if (db) {
  onValue(ref(db, 'config/codes'), (snap) => {
    const v = snap.val();
    if (!v) return;
    if (Array.isArray(v.user)) USER_SEQ = v.user;
    try { localStorage.setItem('sl_codes', JSON.stringify({ user: USER_SEQ })); } catch {}
  });
}

const TARGET_PAGE = 'app.html';
const VENDOR_PAGE = 'super-admin.html';

let current = '0', history = '', pressed = [];
const $c = document.getElementById('current');
const $h = document.getElementById('history');
const render = () => { $c.textContent = current; $h.textContent = history; };

function pressNum(n) {
  pressed.push(n);
  if (current === '0' && n !== '.') current = n;
  else if (current === 'Error') current = n;
  else current += n;
  if (current.replace('-','').replace('.','').length > 12) current = current.slice(0, 13);
  render();
}

function pressOp(op) {
  pressed.push(op);
  if (current !== '0' && current !== 'Error') {
    history = current + ' ' + opToSym(op);
    current = '0';
  } else if (history) {
    history = history.replace(/[+\-×÷]\s*$/, opToSym(op));
  }
  render();
}

function opToSym(o) { return {'+':'+','-':'−','*':'×','/':'÷'}[o] || o; }
function clearAll() { current = '0'; history = ''; pressed = []; render(); }

function backspace() {
  if (current === 'Error') { current = '0'; render(); return; }
  if (current.length <= 1 || (current.length === 2 && current.startsWith('-'))) current = '0';
  else current = current.slice(0, -1);
  render();
}

function toggleSign() {
  if (current === '0' || current === 'Error') return;
  current = current.startsWith('-') ? current.slice(1) : '-' + current;
  render();
}

function percent() {
  if (current === 'Error') return;
  current = String(parseFloat(current) / 100);
  render();
}

function seqMatch(seq) {
  return pressed.length === seq.length && pressed.every((v, i) => v === seq[i]);
}

function calcEquals() {
  if (seqMatch(USER_SEQ)) { unlock('user'); return; }
  if (seqMatch(VENDOR_SEQ)) { unlock('vendor'); return; }
  try {
    const expr = history.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-') + current;
    if (!expr.trim()) { render(); return; }
    const result = Function('"use strict";return (' + expr + ')')();
    if (!isFinite(result)) throw new Error();
    history = '';
    current = String(Math.round(result * 1e10) / 1e10);
  } catch {
    current = 'Error'; history = '';
  }
  render();
  pressed = [];
}

function unlock(role) {
  sessionStorage.setItem('unlocked', '1');
  sessionStorage.setItem('unlockedAt', String(Date.now()));
  sessionStorage.setItem('appRole', role);
  document.body.style.transition = 'opacity .15s';
  document.body.style.opacity = '0';
  const target = role === 'vendor' ? VENDOR_PAGE : TARGET_PAGE;
  setTimeout(() => window.location.replace(target), 160);
}

document.querySelectorAll('.key').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.num !== undefined) pressNum(btn.dataset.num);
    else if (btn.dataset.op) pressOp(btn.dataset.op);
    else if (btn.dataset.action === 'clear') clearAll();
    else if (btn.dataset.action === 'backspace') backspace();
    else if (btn.dataset.action === 'equals') calcEquals();
    else if (btn.dataset.action === 'sign') toggleSign();
    else if (btn.dataset.action === 'percent') percent();
  });
});

document.addEventListener('keydown', e => {
  if (/^[0-9.]$/.test(e.key)) pressNum(e.key);
  else if (['+','-','*','/'].includes(e.key)) pressOp(e.key);
  else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calcEquals(); }
  else if (e.key === 'Escape') clearAll();
  else if (e.key === 'Backspace') { e.preventDefault(); backspace(); }
  else if (e.key === '%') percent();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

render();
</script>
</body>
</html>
